[package]
name = "lucent"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "An interactive mathematics workbench with explicit numerical evidence"

[lib]
crate-type = ["rlib", "staticlib"]

[dependencies]
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"

[build-dependencies]
cc = "=1.2.36"
pkg-config = "=0.3.32"


[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
